name: Agent Issue Resolver

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resolve-agent:
    name: Resolve Issue via Local Runner (Worktree Isolated)
    if: contains(github.event.issue.labels.*.name, 'ready-for-agent')
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prepare Copilot CLI in non-interactive mode
        env:
          # Copilot CLI will read this token and bypass interactive login
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          echo "Preparing Copilot CLI token in environment"
          # Diagnostic: print copilot version if available
          copilot --version || echo "copilot CLI not found on runner"

      - name: Run Agent Harness on Local Runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          MODEL_PROFILE: ${{ contains(github.event.issue.labels.*.name, 'model:smart') && 'smart' || 'fast' }}
        run: |
          node scripts/run-agent-harness.mjs \
            --issue "$ISSUE_NUMBER" \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY" \
            --runner local \
            --model "$MODEL_PROFILE"
